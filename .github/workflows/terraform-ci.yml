# =============================================================================
# terraform-ci.yml
# Continuous Integration workflow for Terraform code.
# Triggers on every push to any branch and on pull requests targeting main.
# Performs formatting checks, validation, and a dev environment plan.
# Uses OIDC to authenticate with AWS — no stored credentials required.
# =============================================================================

name: Terraform CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

# Cancel any in-flight runs for the same ref/PR to avoid wasted compute.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write   # Required for OIDC token request
  contents: read    # Required to checkout the repository
  pull-requests: write  # Required to post plan as PR comment

env:
  TF_VERSION: "1.13.0"
  AWS_REGION: ${{ secrets.AWS_REGION }}
  WORKING_DIR_DEV: environments/dev

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint & Format
  # Checks that all Terraform files are correctly formatted.
  # ---------------------------------------------------------------------------
  lint:
    name: "Terraform Format Check"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269ef065  # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure Terraform plugin cache directory
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

      - name: Restore Terraform provider cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.terraform.d/plugin-cache
            environments/dev/.terraform
            environments/prod/.terraform
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-

      - name: Terraform Format Check (recursive)
        run: terraform fmt -check -recursive
        working-directory: ${{ github.workspace }}

  # ---------------------------------------------------------------------------
  # Job 2: Validate
  # Initialises Terraform in dev and validates the configuration syntax.
  # ---------------------------------------------------------------------------
  validate:
    name: "Terraform Validate"
    runs-on: ubuntu-24.04
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269ef065  # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure Terraform plugin cache directory
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

      - name: Restore Terraform provider cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.terraform.d/plugin-cache
            ${{ env.WORKING_DIR_DEV }}/.terraform
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: TerraformCIValidate

      - name: Terraform Init (dev)
        run: terraform init -input=false
        working-directory: ${{ env.WORKING_DIR_DEV }}

      - name: Terraform Validate (dev)
        run: terraform validate -no-color
        working-directory: ${{ env.WORKING_DIR_DEV }}

  # ---------------------------------------------------------------------------
  # Job 3: Plan
  # Generates and posts a Terraform plan for the dev environment.
  # On pull requests, the plan output is posted as a PR comment.
  # ---------------------------------------------------------------------------
  plan:
    name: "Terraform Plan (dev)"
    runs-on: ubuntu-24.04
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269ef065  # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true  # Enables capturing stdout/stderr for plan output

      - name: Configure Terraform plugin cache directory
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

      - name: Restore Terraform provider cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.terraform.d/plugin-cache
            ${{ env.WORKING_DIR_DEV }}/.terraform
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: TerraformCIPlan

      - name: Terraform Init (dev)
        run: terraform init -input=false
        working-directory: ${{ env.WORKING_DIR_DEV }}

      - name: Terraform Plan (dev)
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan.binary 2>&1 | tee plan_output.txt
        working-directory: ${{ env.WORKING_DIR_DEV }}
        continue-on-error: true

      - name: Upload plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: tfplan-dev-${{ github.sha }}
          path: ${{ env.WORKING_DIR_DEV }}/tfplan.binary
          retention-days: 7

      - name: Post Plan as PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('${{ env.WORKING_DIR_DEV }}/plan_output.txt', 'utf8');
            const maxLength = 65000;
            const truncated = planOutput.length > maxLength
              ? planOutput.substring(0, maxLength) + '\n\n... Output truncated. See workflow run for full plan.'
              : planOutput;
            const outcome = '${{ steps.plan.outcome }}';
            const body = `## Terraform Plan — \`dev\` environment
            **Workflow:** \`${{ github.workflow }}\`
            **Triggered by:** @${{ github.actor }}
            **Status:** ${outcome === 'success' ? '✅ Plan succeeded' : '❌ Plan failed'}

            <details>
            <summary>📋 Click to expand plan output</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`
            </details>

            *Run ID: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            // Find any existing plan comment and update it, otherwise create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existingComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Terraform Plan — `dev` environment')
            );
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Fail workflow if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
